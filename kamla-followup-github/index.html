<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f3b4c">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Follow-up">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Kamla Follow-up</title>
<style>
:root{
  --navy:#2f3b4c; --navy-2:#3d4b5f; --ink:#1f2933; --muted:#6b7480; --line:#e3e6ea; --bg:#f3f4f6; --card:#ffffff;
  --amber:#e08e0b; --amber-bg:#fff1dc; --amber-ink:#8a5a00;
  --blue:#2f7bc0;  --blue-bg:#e3f0fb;  --blue-ink:#1d5a91;
  --green:#2e9e5b; --green-bg:#e3f5ea; --green-ink:#1e7a44;
  --red:#c2321f;   --red-bg:#fbe3e0;
  --grey-bg:#eceef1;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 0 10px}
.top .wrap{display:flex;align-items:center;gap:10px}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
.top .who{font-size:12px;opacity:.75}
.top .sp{flex:1}
.iconbtn{background:rgba(255,255,255,.12);border:0;color:#fff;width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.iconbtn:active{background:rgba(255,255,255,.25)}
.iconbtn svg{width:20px;height:20px}

/* bottom nav */
main{padding:12px 0 calc(84px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:flex;padding:0}
.nav button{flex:1;border:0;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);font-weight:600}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--navy)}
.nav button.on svg{stroke:var(--navy)}
.nav .badge{position:absolute;margin-left:22px;margin-top:-4px;background:var(--red);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;min-width:16px;line-height:16px}

/* summary + filters */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.sum div{background:var(--card);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow)}
.sum b{display:block;font-size:20px}
.sum span{font-size:12px;color:var(--muted)}
.sum .od b{color:var(--red)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.fchip.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 12px 10px;margin-bottom:10px;border-left:4px solid var(--line)}
.card.st-Overdue{border-left-color:var(--red)}
.card.st-Pending{border-left-color:var(--amber)}
.card.st-Done{border-left-color:var(--green)}
.card.st-Details{border-left-color:#9aa3ae}
.r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.co{font-size:11px;font-weight:800;background:var(--navy);color:#fff;border-radius:6px;padding:2px 6px}
.inv{font-weight:700;font-size:15.5px}
.dt{color:var(--muted);font-size:13px}
.pill{margin-left:auto;font-size:11.5px;font-weight:700;border-radius:12px;padding:2px 9px}
.pill.Overdue{background:var(--red-bg);color:var(--red)}
.pill.Pending{background:var(--amber-bg);color:var(--amber-ink)}
.pill.Done{background:var(--green-bg);color:var(--green-ink)}
.pill.Details{background:var(--grey-bg);color:var(--muted)}
.cust{font-size:16px;font-weight:600;margin-top:4px}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.meta a{color:var(--blue-ink);text-decoration:none;font-weight:600}
.rem{font-size:13px;margin-top:4px;background:#f7f8fa;border-radius:8px;padding:5px 8px;color:#3b4552}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.step{border:1.5px solid transparent;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;min-height:40px;justify-content:center}
.step small{font-weight:500;font-size:11px;opacity:.85}
.step.credit{background:var(--amber-bg);color:var(--amber-ink);border-color:#f3cf8f}
.step.proof{background:var(--blue-bg);color:var(--blue-ink);border-color:#a9cdee}
.step.call{background:var(--green-bg);color:var(--green-ink);border-color:#a6dcbc}
.step.od{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.step.od small{color:var(--red);opacity:1;font-weight:700}
.step.opt{border-style:dashed;background:#fff}
.step.done{background:#fff;color:var(--green-ink);border-color:var(--line);font-weight:600}
.step:active{transform:scale(.97)}
.cardfoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.cardfoot small{color:var(--muted);font-size:11.5px}
.linkbtn{border:0;background:none;color:var(--blue-ink);font-weight:700;font-size:13px;padding:6px 4px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:4px}

/* forms */
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.panel h2{font-size:16px;margin:0 0 10px}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 0 5px}
label.f:first-of-type{margin-top:0}
.in{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;font-size:16px}
.in:focus{outline:none;border-color:var(--navy)}
.in:disabled{background:#f3f4f6;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 0;font-weight:800}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.preview{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.preview .t{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:16px;background:var(--navy);color:#fff;margin-top:14px}
.btn:disabled{opacity:.55}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid #f1c0b9}
.err{background:var(--red-bg);color:var(--red);border-radius:10px;padding:9px 11px;font-size:13.5px;font-weight:600;margin-top:12px}
.searchbar{display:flex;gap:8px;margin-bottom:12px}
.searchbar .in{flex:1}
.searchbar button{border:0;background:var(--navy);color:#fff;border-radius:10px;padding:0 16px;font-weight:700}
.tatrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.tatrow:last-child{border-bottom:0}
.tatrow span{flex:1;font-weight:600}
.tatrow .in{width:80px;text-align:center}
.tatrow em{font-style:normal;font-size:12px;color:var(--muted);width:42px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.urow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:11px 2px;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.urow .av{width:36px;height:36px;border-radius:50%;background:var(--grey-bg);display:grid;place-items:center;font-weight:800;color:var(--navy);flex:none}
.urow .nm{flex:1;font-weight:700}
.urow .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.tag{font-size:11px;font-weight:800;border-radius:10px;padding:2px 8px;background:var(--grey-bg);color:var(--muted)}
.tag.admin{background:#e7e9f7;color:#3a3f8f}
.tag.off{background:var(--red-bg);color:var(--red)}
.urow.inactive .nm{color:var(--muted)}
.backbtn{border:0;background:none;color:var(--blue-ink);font-weight:700;padding:4px 0 10px;font-size:14px}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 18px;max-width:420px;margin:0 auto}
.brand{text-align:center;margin-bottom:22px}
.brand .logo{width:58px;height:58px;border-radius:16px;background:var(--navy);display:grid;place-items:center;margin:0 auto 10px}
.brand .logo svg{width:30px;height:30px}
.brand h1{margin:0;font-size:21px}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.pin{letter-spacing:14px;text-align:center;font-size:24px;font-weight:800}

/* sheet + toast + loading */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet p{margin:0 0 6px;color:var(--muted);font-size:14px}
.sheet .row{display:flex;gap:10px}
.sheet .row .btn{margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:45;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.bad{background:var(--red)}
.busy{position:fixed;inset:0;z-index:70;background:rgba(255,255,255,.55);display:grid;place-items:center}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid #d5dae1;border-top-color:var(--navy);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.cfg{max-width:520px;margin:40px auto;padding:20px}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   Kamla Dispatch & Credit Follow-up — app v1.1
   Paste the Apps Script web app URL below (ends in /exec).
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbzh98AcwcVN5Lv7BsxeHbh5savmpM7uakwPEeRYb5Gq1z9YXPYBS-pd-vyMyHPVBO8Q/exec';
const APP_VERSION = '1.1';

const STEP_META = {
  bill:      { short: 'Bill',      group: 'credit', full: 'Bill shared (W/A group)' },
  ledger:    { short: 'Ledger',    group: 'credit', full: 'Ledger shared (W/A group)' },
  lr:        { short: 'LR Copy',   group: 'proof',  full: 'LR copy shared' },
  receiving: { short: 'Receiving', group: 'proof',  full: 'Receiving shared' },
  call:      { short: 'Call',      group: 'call',   full: 'Called: dispatch informed' }
};
const STEP_ORDER = ['bill', 'ledger', 'lr', 'receiving', 'call'];

/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd = ymd => { if (!ymd) return ''; const [y, m, d] = ymd.split('-'); return `${d} ${MON[+m - 1]}`; };
const fdt = s => { if (!s) return ''; const [d, t] = s.split(' '); return fd(d) + (t ? ' ' + t : ''); };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const ICON = {
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>',
  add: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>',
  me: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>',
  truck: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>'
};

/* ---------- state ---------- */
const S = {
  session: store.get('fu_session'),   // { token, user, role, expires }
  boot: null,
  entries: [],
  loadedAt: 0,
  view: 'pending',
  filter: store.get('fu_filter') || 'all',
  form: null,          // { mode:'add'|'edit', data, originalKey, error }
  search: { q: '', results: null },
  users: null,         // Admin → Manage users
  userForm: null,      // { isNew, name, role, active, error }
  busy: false
};

/* ---------- API ---------- */
class AuthError extends Error {}
async function api(action, body = {}) {
  const payload = Object.assign({ action }, body);
  if (S.session && action !== 'login' && action !== 'users') payload.token = S.session.token;
  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), redirect: 'follow' });
  } catch (e) {
    throw new Error('No connection. Check internet and try again.');
  }
  let data;
  try { data = await res.json(); } catch (e) { throw new Error('The server sent an unexpected reply. Try again.'); }
  if (data && data.auth) { logout(data.error); throw new AuthError(data.error); }
  return data;
}

async function withBusy(fn) {
  if (S.busy) return;
  S.busy = true; $('#busy') ? null : document.body.insertAdjacentHTML('beforeend', '<div class="busy" id="busy"><div class="spin"></div></div>');
  try { return await fn(); }
  catch (e) { if (!(e instanceof AuthError)) toast(e.message || String(e), true); }
  finally { S.busy = false; const b = $('#busy'); if (b) b.remove(); }
}

let toastTimer;
function toast(msg, bad) {
  const old = $('.toast'); if (old) old.remove();
  document.body.insertAdjacentHTML('beforeend', `<div class="toast${bad ? ' bad' : ''}">${esc(msg)}</div>`);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { const t = $('.toast'); if (t) t.remove(); }, bad ? 4200 : 2400);
}

function clearToast() { const t = $('.toast'); if (t) t.remove(); }
function sheet({ title, text, ok, okClass = '', cancel = 'Cancel' }) {
  clearToast();
  return new Promise(resolve => {
    document.body.insertAdjacentHTML('beforeend', `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">
      <h3>${esc(title)}</h3>${text ? `<p>${text}</p>` : ''}
      <div class="row"><button class="btn ghost" data-a="no">${esc(cancel)}</button><button class="btn ${okClass}" data-a="yes">${esc(ok)}</button></div></div></div>`);
    const sc = $('#scrim');
    sc.addEventListener('click', e => {
      const a = e.target.dataset && e.target.dataset.a;
      if (e.target === sc || a) { sc.remove(); resolve(a === 'yes'); }
    });
  });
}

/* ---------- session ---------- */
function loggedIn() { return S.session && S.session.token && Date.now() < S.session.expires; }
function logout(msg) {
  S.session = null; S.boot = null; S.entries = []; store.del('fu_session');
  S.view = 'pending'; S.form = null; S.search = { q: '', results: null }; S.users = null; S.userForm = null;
  renderLogin(msg);
}

/* ============================================================
   LOGIN
   ============================================================ */
async function renderLogin(msg) {
  const last = store.get('fu_lastuser') || '';
  $('#app').innerHTML = `
  <div class="login">
    <div class="brand"><div class="logo">${ICON.truck}</div><h1>Dispatch &amp; Credit Follow-up</h1><p>Kamla Group</p></div>
    <form class="panel" id="loginForm" autocomplete="off">
      <label class="f" for="lu">Your name</label>
      <select class="in" id="lu"><option value="">Loading names…</option></select>
      <label class="f" for="lp">4-digit PIN</label>
      <input class="in pin" id="lp" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" placeholder="••••">
      ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
      <div class="err" id="lerr" hidden></div>
      <button class="btn" id="lbtn" type="submit">Log in</button>
    </form>
  </div>`;
  const sel = $('#lu');
  try {
    const r = await api('users');
    if (!r.ok) throw new Error(r.error);
    sel.innerHTML = '<option value="">Select your name</option>' + r.users.map(u => `<option ${u === last ? 'selected' : ''}>${esc(u)}</option>`).join('');
  } catch (e) {
    // fall back to typing the name
    sel.outerHTML = `<input class="in" id="lu" placeholder="Type your name" value="${esc(last)}">`;
  }
  $('#lp').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4); });
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const user = $('#lu').value.trim(), pin = $('#lp').value.trim(), err = $('#lerr');
    err.hidden = true;
    if (!user || !/^\d{4}$/.test(pin)) { err.textContent = 'Select your name and enter your 4-digit PIN.'; err.hidden = false; return; }
    $('#lbtn').disabled = true; $('#lbtn').textContent = 'Checking…';
    try {
      const r = await api('login', { user, pin });
      if (!r.ok) throw new Error(r.error);
      S.session = { token: r.token, user: r.user, role: r.role, expires: r.expires };
      store.set('fu_session', S.session); store.set('fu_lastuser', r.user);
      start();
    } catch (ex) {
      err.textContent = ex.message; err.hidden = false; $('#lp').value = '';
      $('#lbtn').disabled = false; $('#lbtn').textContent = 'Log in';
    }
  });
}

/* ============================================================
   APP SHELL
   ============================================================ */
async function start() {
  renderShell();
  $('#main').innerHTML = '<div class="empty"><div class="spin" style="margin:0 auto 10px"></div>Loading…</div>';
  try {
    const b = await api('bootstrap');
    if (!b.ok) throw new Error(b.error);
    S.boot = b;
    await loadEntries(true);
  } catch (e) {
    if (e instanceof AuthError) return;
    $('#main').innerHTML = `<div class="empty"><b>Could not load</b>${esc(e.message)}<br><br><button class="btn" style="max-width:220px" onclick="start()">Try again</button></div>`;
  }
}

function renderShell() {
  const s = S.session;
  $('#app').innerHTML = `
  <header class="top"><div class="wrap">
    <div><h1>Follow-up</h1><div class="who">${esc(s.user)} · ${esc(s.role)}</div></div>
    <div class="sp"></div>
    <button class="iconbtn" id="refresh" aria-label="Refresh">${ICON.refresh}</button>
  </div></header>
  <main><div class="wrap" id="main"></div></main>
  <nav class="nav"><div class="wrap">
    <button data-v="pending">${ICON.list}<span>Pending</span><i class="badge" id="nbadge" hidden></i></button>
    <button data-v="add">${ICON.add}<span>Add</span></button>
    <button data-v="search">${ICON.search}<span>Search</span></button>
    <button data-v="me">${ICON.me}<span>${s.role === 'Admin' ? 'Settings' : 'Me'}</span></button>
  </div></nav>`;
  document.querySelectorAll('.nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.v)));
  $('#refresh').addEventListener('click', () => withBusy(() => loadEntries(true)));
}

function go(view) {
  S.view = view; clearToast();
  if (view === 'users') { S.userForm = null; S.users = null; }
  if (view === 'add') S.form = { mode: 'add', data: blankEntry(), originalKey: null, error: '' };
  render();
  window.scrollTo(0, 0);
}

function render() {
  if (!S.boot) return;
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.v === ({ edit: 'pending', users: 'me' }[S.view] || S.view)));
  const od = S.entries.filter(e => e.status === 'Overdue').length;
  const nb = $('#nbadge'); if (nb) { nb.hidden = !od; nb.textContent = od; }
  ({ pending: renderPending, add: renderForm, edit: renderForm, search: renderSearch, me: renderMe, users: renderUsers })[S.view]();
}

async function loadEntries(rerender) {
  const r = await api('list', { scope: 'open' });
  if (!r.ok) throw new Error(r.error);
  S.entries = r.entries; S.loadedAt = Date.now();
  if (S.boot) S.boot.today = r.today;
  if (rerender) render();
}

/* ============================================================
   PENDING
   ============================================================ */
function renderPending() {
  const all = S.entries;
  const count = st => all.filter(e => e.status === st).length;
  const filters = [['all', 'All'], ['Overdue', 'Overdue'], ['Details missing', 'Details missing']].concat(S.boot.lists.company.map(c => [c, c]));
  let list = all;
  if (S.filter === 'Overdue' || S.filter === 'Details missing') list = all.filter(e => e.status === S.filter);
  else if (S.filter !== 'all') list = all.filter(e => e.company === S.filter);

  $('#main').innerHTML = `
    <div class="sum">
      <div class="od"><b>${count('Overdue')}</b><span>Overdue</span></div>
      <div><b>${count('Pending')}</b><span>Pending</span></div>
      <div><b>${count('Details missing')}</b><span>Details missing</span></div>
    </div>
    <div class="filters">${filters.map(([k, l]) => `<button class="fchip ${S.filter === k ? 'on' : ''}" data-f="${esc(k)}">${esc(l)}</button>`).join('')}</div>
    <div id="cards">${list.length ? list.map(cardHtml).join('') : emptyHtml()}</div>`;
  document.querySelectorAll('.fchip').forEach(b => b.addEventListener('click', () => { S.filter = b.dataset.f; store.set('fu_filter', S.filter); renderPending(); }));
  bindCards($('#cards'));
}

function emptyHtml() {
  return S.entries.length
    ? '<div class="empty"><b>Nothing here</b>No entries match this filter.</div>'
    : '<div class="empty"><b>All caught up 🎉</b>No pending follow-ups. Tap <b>Add</b> to enter a new invoice.</div>';
}

function cardHtml(e) {
  const st = e.status === 'Details missing' ? 'Details' : (e.status || 'Pending');
  const bits = [esc(e.payment), e.transport ? esc(e.transport) : '<i>transport not set</i>', e.gatePass ? 'GP ' + esc(e.gatePass) : '', esc(e.salesPerson)].filter(Boolean);
  const mob = e.mobile ? ` · <a href="tel:${esc(e.mobile)}">📞 ${esc(e.mobile)}</a>` : '';
  return `<article class="card st-${st}" data-co="${esc(e.company)}" data-inv="${esc(e.invoice)}">
    <div class="r1"><span class="co">${esc(e.company)}</span><span class="inv">${esc(e.invoice)}</span><span class="dt">${fd(e.date)}</span><span class="pill ${st}">${esc(e.status || '')}</span></div>
    <div class="cust">${esc(e.customer)}</div>
    <div class="meta">${bits.join(' · ')}${mob}</div>
    ${e.remarks ? `<div class="rem">${esc(e.remarks)}</div>` : ''}
    <div class="steps">${stepsHtml(e)}</div>
    <div class="cardfoot"><small>${e.addedBy ? 'Added by ' + esc(e.addedBy) : ''}</small><button class="linkbtn" data-edit>Edit</button></div>
  </article>`;
}

function stepsHtml(e) {
  const out = [];
  STEP_ORDER.forEach(k => {
    const s = e.steps[k], m = STEP_META[k];
    if (!s) return;
    if (s.done) {
      out.push(`<button class="step done" data-step="${k}" data-done="1">✓ ${m.short}<small>${esc(s.by)} · ${fd(s.on)}${s.late ? ' · late' : ''}</small></button>`);
    } else if (s.need === 'Y') {
      out.push(`<button class="step ${m.group}${s.overdue ? ' od' : ''}" data-step="${k}">${m.short}<small>${s.overdue ? 'overdue · due ' : 'due '}${fd(s.due)}</small></button>`);
    } else if (s.need === 'O') {
      out.push(`<button class="step ${m.group} opt" data-step="${k}">${m.short}<small>if applicable</small></button>`);
    }
  });
  if (!out.length) out.push(e.status === 'Details missing'
    ? '<span class="hint">Add the transport mode to see the steps.</span>'
    : '<span class="hint">No follow-up steps needed.</span>');
  return out.join('');
}

function findEntry(co, inv) { return S.entries.find(x => x.company === co && x.invoice === inv) || (S.search.results || []).find(x => x.company === co && x.invoice === inv); }

function bindCards(root) {
  root.querySelectorAll('.card').forEach(card => {
    const co = card.dataset.co, inv = card.dataset.inv;
    card.querySelectorAll('.step').forEach(b => b.addEventListener('click', () => onStep(co, inv, b.dataset.step, !!b.dataset.done)));
    const ed = card.querySelector('[data-edit]');
    if (ed) ed.addEventListener('click', () => openEdit(findEntry(co, inv)));
  });
}

async function onStep(co, inv, step, isDone) {
  const e = findEntry(co, inv); if (!e) return;
  const m = STEP_META[step], s = e.steps[step];
  if (isDone) {
    const ok = await sheet({ title: `Undo “${m.full}”?`, text: `Marked by <b>${esc(s.by)}</b> on ${fdt(s.onTime)}.<br>${esc(co)} ${esc(inv)} · ${esc(e.customer)}`, ok: 'Undo', okClass: 'danger' });
    if (!ok) return;
    return withBusy(async () => {
      const r = await api('undo', { company: co, invoice: inv, step });
      if (!r.ok) throw new Error(r.error);
      applyEntry(r.entry); toast('Undone');
    });
  }
  const ok = await sheet({ title: `Mark “${m.full}”?`, text: `${esc(co)} ${esc(inv)} · ${esc(e.customer)}<br>It will be recorded under <b>${esc(S.session.user)}</b>, today.`, ok: 'Yes, done' });
  if (!ok) return;
  return withBusy(async () => {
    const r = await api('mark', { company: co, invoice: inv, step });
    if (!r.ok) throw new Error(r.error);
    applyEntry(r.entry);
    toast(r.entry.status === 'Done' ? `${co} ${inv} — all done ✓` : `${m.short} marked ✓`);
  });
}

// Put a fresh copy of one entry into the lists and re-render.
function applyEntry(ne) {
  const same = x => x.company === ne.company && x.invoice === ne.invoice;
  const i = S.entries.findIndex(same);
  if (ne.status === 'Done') { if (i !== -1) S.entries.splice(i, 1); }
  else if (i !== -1) S.entries[i] = ne;
  else S.entries.push(ne);
  if (S.search.results) { const j = S.search.results.findIndex(same); if (j !== -1) S.search.results[j] = ne; }
  render();
}

/* ============================================================
   ADD / EDIT
   ============================================================ */
function todayYmd() { return (S.boot && S.boot.today) || new Date().toISOString().slice(0, 10); }
function blankEntry() {
  const last = store.get('fu_lastco');
  return { company: last && S.boot.lists.company.includes(last) ? last : '', date: todayYmd(), gatePass: '', invoice: '', customer: '', mobile: '', salesPerson: '', payment: '', transport: '', remarks: '' };
}

function openEdit(e) {
  if (!e) return;
  S.form = { mode: 'edit', data: Object.assign({}, e), originalKey: { company: e.company, invoice: e.invoice }, error: '' };
  S.view = 'edit'; render(); window.scrollTo(0, 0);
}

function opts(list, val, ph) {
  return `<option value="">${esc(ph)}</option>` + list.map(x => `<option ${x === val ? 'selected' : ''}>${esc(x)}</option>`).join('');
}

function renderForm() {
  const f = S.form, d = f.data, L = S.boot.lists, edit = f.mode === 'edit';
  const anyDone = edit && STEP_ORDER.some(k => d.steps && d.steps[k] && d.steps[k].done);
  const dateLocked = anyDone && S.session.role !== 'Admin';
  $('#main').innerHTML = `
  <form class="panel" id="ef" autocomplete="off" novalidate>
    <h2>${edit ? `Edit ${esc(f.originalKey.company)} ${esc(f.originalKey.invoice)}` : 'New entry'}</h2>
    <label class="f">Company</label>
    <div class="seg" id="coSeg">${L.company.map(c => `<button type="button" class="${d.company === c ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <div class="grid2">
      <div><label class="f" for="fdate">Date</label><input class="in" id="fdate" type="date" value="${esc(d.date)}" ${dateLocked ? 'disabled' : ''}></div>
      <div><label class="f" for="fgp">Gate Pass No.</label><input class="in" id="fgp" inputmode="numeric" value="${esc(d.gatePass)}"></div>
    </div>
    ${dateLocked ? '<div class="hint">Steps are already marked, so only an Admin can change the date.</div>' : ''}
    <label class="f" for="finv">Invoice No.</label><input class="in" id="finv" value="${esc(d.invoice)}" placeholder="e.g. 765/26-27">
    <label class="f" for="fcust">Customer Name</label><input class="in" id="fcust" value="${esc(d.customer)}" autocapitalize="words">
    <div class="grid2">
      <div><label class="f" for="fmob">Mobile No.</label><input class="in" id="fmob" type="tel" inputmode="tel" maxlength="14" value="${esc(d.mobile)}"></div>
      <div><label class="f" for="fsp">Sales Person</label><select class="in" id="fsp">${opts(L.salesPerson, d.salesPerson, '—')}</select></div>
    </div>
    <div class="grid2">
      <div><label class="f" for="fpay">Payment</label><select class="in" id="fpay">${opts(L.payment, d.payment, 'Select')}</select></div>
      <div><label class="f" for="ftr">Transport</label><select class="in" id="ftr">${opts(L.transport, d.transport, 'Select')}</select></div>
    </div>
    <label class="f" for="frem">Remarks</label><textarea class="in" id="frem" rows="2">${esc(d.remarks)}</textarea>
    <div class="preview" id="prev"></div>
    ${f.error ? `<div class="err">${esc(f.error)}</div>` : ''}
    <button class="btn" type="submit">${edit ? 'Save changes' : 'Save entry'}</button>
    ${edit ? '<button class="btn ghost" type="button" id="fcancel">Cancel</button>' : ''}
  </form>`;
  document.querySelectorAll('#coSeg button').forEach(b => b.addEventListener('click', () => {
    f.data.company = b.dataset.c; document.querySelectorAll('#coSeg button').forEach(x => x.classList.toggle('on', x === b));
  }));
  ['fpay', 'ftr'].forEach(id => $('#' + id).addEventListener('change', updatePreview));
  updatePreview();
  if (edit) $('#fcancel').addEventListener('click', () => go('pending'));
  $('#ef').addEventListener('submit', e => { e.preventDefault(); saveForm(); });
}

function updatePreview() {
  const pay = $('#fpay').value, tr = $('#ftr').value, R = S.boot.rules;
  const need = [];
  const p = R.payment[pay] || {}, t = R.transport[tr] || {};
  if (p.bill) need.push('bill'); if (p.ledger) need.push('ledger');
  ['lr', 'receiving', 'call'].forEach(k => { if (t[k]) need.push(k); });
  let html;
  if (!pay || !tr) html = '<span class="hint">Pick payment and transport to see which steps apply.</span>';
  else {
    html = need.map(k => `<span class="step ${STEP_META[k].group}">${STEP_META[k].short}<small>${tatText(S.boot.tat[k])}</small></span>`).join('');
    if (tr === 'Other') html += `<span class="step proof opt">LR / Receiving / Call<small>mark if applicable</small></span>`;
    if (!html) html = '<span class="hint">No follow-up steps needed.</span>';
  }
  $('#prev').innerHTML = `<div class="t">Steps for this entry</div><div class="steps" style="margin-top:0">${html}</div>`;
}

function tatText(n) { return n === 0 ? 'same day' : `within ${n} day${n === 1 ? '' : 's'}`; }

function readForm() {
  const d = S.form.data;
  return {
    company: d.company,
    date: $('#fdate').value,
    gatePass: $('#fgp').value.trim(),
    invoice: $('#finv').value.trim(),
    customer: $('#fcust').value.trim(),
    mobile: $('#fmob').value.trim(),
    salesPerson: $('#fsp').value,
    payment: $('#fpay').value,
    transport: $('#ftr').value,
    remarks: $('#frem').value.trim()
  };
}

function saveForm() {
  const f = S.form, entry = readForm();
  Object.assign(f.data, entry);
  const miss = [];
  if (!entry.company) miss.push('Company'); if (!entry.date) miss.push('Date'); if (!entry.invoice) miss.push('Invoice No.');
  if (!entry.customer) miss.push('Customer Name'); if (!entry.payment) miss.push('Payment');
  if (miss.length) { f.error = 'Please fill: ' + miss.join(', ') + '.'; return renderForm(); }
  if (entry.mobile && !/^\+?\d{10,13}$/.test(entry.mobile.replace(/[\s-]/g, ''))) { f.error = 'Mobile No. should be 10 digits.'; return renderForm(); }
  f.error = '';
  return saveFormSubmit(f, entry);
}

async function saveFormSubmit(f, entry) {
  const r = await withBusy(() => api('save', { entry, originalKey: f.originalKey }));
  if (!r) return;                                   // network / auth error already shown
  if (r.exists) {                                   // ask only after the loading overlay is gone
    const open = await sheet({ title: 'Already entered', text: esc(r.error), ok: 'Open it' });
    if (open) await withBusy(() => openExisting(entry.company, entry.invoice));
    return;
  }
  if (!r.ok) { f.error = r.error; renderForm(); return; }
  store.set('fu_lastco', entry.company);
  toast(r.created ? 'Saved ✓' : 'Changes saved ✓');
  applyEntryQuiet(r.entry);
  if (f.mode === 'add') { S.form = { mode: 'add', data: Object.assign(blankEntry(), { company: entry.company }), originalKey: null, error: '' }; renderForm(); window.scrollTo(0, 0); }
  else go('pending');
}

function applyEntryQuiet(ne) {
  const same = x => x.company === ne.company && x.invoice === ne.invoice;
  if (S.form && S.form.originalKey) {   // key may have changed while editing
    const ok = S.form.originalKey;
    S.entries = S.entries.filter(x => !(x.company === ok.company && x.invoice === ok.invoice));
  }
  S.entries = S.entries.filter(x => !same(x));
  if (ne.status !== 'Done') S.entries.push(ne);
  if (S.search.results) { const j = S.search.results.findIndex(same); if (j !== -1) S.search.results[j] = ne; }
  const nb = $('#nbadge'), od = S.entries.filter(e => e.status === 'Overdue').length;
  if (nb) { nb.hidden = !od; nb.textContent = od; }
}

async function openExisting(co, inv) {
  const r = await api('list', { scope: 'all', q: inv });
  if (!r.ok) throw new Error(r.error);
  const e = r.entries.find(x => x.company === co && x.invoice.toUpperCase() === inv.toUpperCase());
  if (!e) throw new Error('Could not open that entry. Try Search.');
  openEdit(e);
}

   SEARCH
   ============================================================ */
function renderSearch() {
  const s = S.search;
  $('#main').innerHTML = `
    <form class="searchbar" id="sf"><input class="in" id="sq" type="search" placeholder="Customer, invoice, gate pass, mobile" value="${esc(s.q)}" enterkeyhint="search"><button>Find</button></form>
    <div id="sres">${s.results == null ? '<div class="empty">Search all entries — including completed ones.</div>'
      : s.results.length ? `<div class="hint" style="margin:-4px 0 8px">${s.results.length} result${s.results.length === 1 ? '' : 's'}${s.results.length === 200 ? ' (showing latest 200)' : ''}</div>` + s.results.map(cardHtml).join('')
      : '<div class="empty"><b>No match</b>Try a shorter word.</div>'}</div>`;
  $('#sf').addEventListener('submit', e => {
    e.preventDefault();
    const q = $('#sq').value.trim(); s.q = q;
    if (!q) { s.results = null; return renderSearch(); }
    withBusy(async () => {
      const r = await api('list', { scope: 'all', q });
      if (!r.ok) throw new Error(r.error);
      s.results = r.entries; renderSearch();
    });
  });
  if (s.results) bindCards($('#sres'));
}

   ============================================================ */
function renderMe() {
  const s = S.session, b = S.boot, admin = s.role === 'Admin';
  $('#main').innerHTML = `
    <div class="panel">
      <h2>${esc(s.user)}</h2>
      <div class="kv"><span>Role</span><b>${esc(s.role)}</b></div>
      <div class="kv"><span>Logged in until</span><b>midnight</b></div>
      <div class="kv"><span>App version</span><b>${APP_VERSION} · server ${esc(b.version)}</b></div>
    </div>
    ${admin ? `
    <form class="panel" id="tatf">
      <h2>TAT — days allowed per step</h2>
      <div class="hint" style="margin:-6px 0 6px">Counted from the entry date. 0 = same day. Changes apply to the sheet, the colours and the KPI straight away.</div>
      ${STEP_ORDER.map(k => `<div class="tatrow"><span>${STEP_META[k].full}</span><input class="in" type="number" inputmode="numeric" min="0" max="30" step="1" id="tat_${k}" value="${esc(b.tat[k])}"><em>days</em></div>`).join('')}
      <button class="btn" type="submit">Save TAT</button>
    </form>` : `
    <div class="panel"><h2>TAT — days allowed</h2>${STEP_ORDER.map(k => `<div class="kv"><span>${STEP_META[k].full}</span><b>${tatText(b.tat[k])}</b></div>`).join('')}</div>`}
    ${admin ? `<div class="panel"><h2>Users</h2><div class="hint" style="margin:-6px 0 4px">Add staff, reset a forgotten PIN, change role or deactivate someone who has left.</div><button class="btn ghost" id="mu" style="margin-top:8px">Manage users</button></div>` : ''}
    <button class="btn danger" id="lo">Log out</button>`;
  if (admin) $('#mu').addEventListener('click', () => go('users'));
  $('#lo').addEventListener('click', async () => { if (await sheet({ title: 'Log out?', ok: 'Log out', okClass: 'danger' })) logout(); });
  if (admin) $('#tatf').addEventListener('submit', e => {
    e.preventDefault();
    const tat = {};
    for (const k of STEP_ORDER) {
      const v = $('#tat_' + k).value.trim();
      if (!/^\d{1,2}$/.test(v) || +v > 30) return toast(STEP_META[k].full + ': enter 0 to 30 days.', true);
      tat[k] = +v;
    }
    withBusy(async () => {
      const r = await api('saveTat', { tat });
      if (!r.ok) throw new Error(r.error);
      S.boot.tat = r.tat; toast('TAT saved ✓');
      await loadEntries(false);
      renderMe();
    });
  });
}

function renderUsers() {
  if (S.session.role !== 'Admin') return go('me');
  if (S.userForm) return renderUserForm();
  if (!S.users) {
    $('#main').innerHTML = '<div class="empty"><div class="spin" style="margin:0 auto 10px"></div>Loading users…</div>';
    withBusy(async () => {
      const r = await api('listUsers');
      if (!r.ok) throw new Error(r.error);
      S.users = r.users; if (S.view === 'users') renderUsers();
    });
    return;
  }
  const list = S.users.slice().sort((a, b) => (b.active - a.active) || a.name.localeCompare(b.name));
  $('#main').innerHTML = `
    <button class="backbtn" id="ub">‹ Settings</button>
    <div class="panel">
      <h2>Users (${S.users.filter(u => u.active).length} active)</h2>
      ${list.map(u => `<button class="urow ${u.active ? '' : 'inactive'}" data-n="${esc(u.name)}">
        <span class="av">${esc(u.name.charAt(0).toUpperCase())}</span>
        <span class="nm">${esc(u.name)}${u.name === S.session.user ? ' <small>you</small>' : ''}${u.pinOk ? '' : '<small style="color:var(--red)">PIN not valid — set a new one</small>'}</span>
        ${u.role === 'Admin' ? '<span class="tag admin">Admin</span>' : '<span class="tag">Staff</span>'}
        ${u.active ? '' : '<span class="tag off">Inactive</span>'}
      </button>`).join('')}
      <button class="btn" id="uadd">＋ Add user</button>
    </div>`;
  $('#ub').addEventListener('click', () => go('me'));
  $('#uadd').addEventListener('click', () => { S.userForm = { isNew: true, name: '', role: 'Staff', active: true, error: '' }; renderUsers(); window.scrollTo(0, 0); });
  document.querySelectorAll('.urow').forEach(b => b.addEventListener('click', () => {
    const u = S.users.find(x => x.name === b.dataset.n);
    S.userForm = { isNew: false, name: u.name, role: u.role, active: u.active, error: '' };
    renderUsers(); window.scrollTo(0, 0);
  }));
}

    const pin = $('#up').value.trim();
    f.error = '';
    if (!f.name) f.error = 'Enter a name.';
    else if (f.isNew && !/^\d{4}$/.test(pin)) f.error = 'Set a 4-digit PIN.';
    else if (!f.isNew && pin && !/^\d{4}$/.test(pin)) f.error = 'PIN must be exactly 4 digits.';
    if (f.error) return renderUserForm();
    const r = await withBusy(() => api('saveUser', { userData: { isNew: f.isNew, name: f.name, pin, role: f.role, active: f.active } }));
    if (!r) return;
    if (!r.ok) { f.error = r.error; return renderUserForm(); }
    if (r.session) { S.session = r.session; store.set('fu_session', S.session); }
    S.users = r.users;
    toast(f.isNew ? `${r.saved} added ✓` : (pin ? `PIN reset for ${r.saved} ✓` : `${r.saved} saved ✓`));
    S.userForm = null; renderUsers(); window.scrollTo(0, 0);
  });
}

/* ============================================================
   BOOT
   ============================================================ */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (S.session && !loggedIn()) return logout('Your login has expired. Please log in again.');
  if (loggedIn() && S.boot && Date.now() - S.loadedAt > 60000 && S.view === 'pending') loadEntries(true).catch(() => {});
});

(function init() {
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(API_URL)) {
    $('#app').innerHTML = '<div class="cfg panel"><h2>Setup needed</h2><p>Open <code>index.html</code> and paste your Apps Script web app URL (ending in <code>/exec</code>) into <code>API_URL</code> at the top of the script.</p></div>';
    return;
  }
  if (loggedIn()) start(); else { if (S.session) store.del('fu_session'); S.session = null; renderLogin(); }
})();
</script>
</body>
</html>
